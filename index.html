<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계약예규 및 행정 실무 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen m-0 p-0">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-lg md:text-xl font-bold">📋 계약예규 & 행정 실무 챗봇</h1>
            <p class="text-xs text-blue-200">정확한 규정 설명과 근거 조항을 바탕으로 안내합니다.</p>
        </div>
        <span class="text-xs bg-blue-800 px-3 py-1 rounded-full text-blue-100">v2.7 실무형</span>
    </header>

    <!-- 메인 채팅 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        <!-- 채팅 대화 박스 -->
        <div id="chat-box" class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 overflow-y-auto space-y-4 flex flex-col">
            <!-- 봇 초기 인사말 -->
            <div class="flex items-start space-x-3">
                <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">BOT</div>
                <div class="bg-slate-100 rounded-2xl px-4 py-3 max-w-xl text-sm leading-relaxed text-slate-700 shadow-sm">
                    안녕하세요! 계약예규 및 행정 실무 챗봇입니다. <strong>지체상금, 낙찰자 결정, 설계변경, 공동계약, 입찰공고 기간</strong> 등에 대해 질문해 주시면 상세한 설명과 함께 <strong>정확한 근거 조항</strong>을 함께 안내해 드리겠습니다.
                </div>
            </div>
        </div>

        <!-- 하단 입력창 -->
        <div class="mt-4 flex gap-2 shrink-0">
            <input type="text" id="user-input" placeholder="예: 지체상금 산정 기준이 어떻게 되나요?" 
                class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm bg-white shadow-sm"
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold text-sm transition shadow-sm">
                전송
            </button>
        </div>
    </main>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (!userText) return;

            // 사용자 메시지 추가
            const userBubble = document.createElement('div');
            userBubble.className = "flex items-start justify-end space-x-3";
            userBubble.innerHTML = `
                <div class="bg-blue-600 text-white rounded-2xl px-4 py-3 max-w-xl text-sm leading-relaxed shadow-sm">
                    ${escapeHtml(userText)}
                </div>
                <div class="bg-slate-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">나</div>
            `;
            chatBox.appendChild(userBubble);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 스마트 봇 응답 로직
            setTimeout(() => {
                const botBubble = document.createElement('div');
                botBubble.className = "flex items-start space-x-3";
                
                let explanation = "";
                let citation = "";

                const text = userText.toLowerCase();

                if (text.includes("지체상금") || text.includes("지체")) {
                    explanation = "계약상대자가 계약서에 정한 준공기한 내에 공사나 물품을 완성·납품하지 아니한 때에는 매 지체일수마다 지체상금률을 계약금액에 곱하여 산출한 금액을 현금으로 납부하여야 합니다. 다만, 납부할 금액이 계약금액의 100분의 30을 초과하는 경우에는 100분의 30으로 제한합니다.";
                    citation = "(계약예규) 공사계약일반조건 제25조(지체상금) / 물품구매(제조)계약일반조건 제24조";
                } else if (text.includes("낙찰자") || text.includes("종합심사") || text.includes("적격심사")) {
                    explanation = "종합심사낙찰제의 경우 기술능력 평가와 입찰가격 평가를 합산한 점수가 가장 높은 자를 낙찰자로 결정합니다. 예정가격 100억원 미만 공사의 경우에는 저가투찰 방지를 위해 재료비·노무비·경비 합계액의 100분의 98 미만으로 입찰한 자는 낙찰자에서 제외됩니다.";
                    citation = "(계약예규) 공사계약 종합심사낙찰제 심사기준 제13조 및 공사계약일반조건";
                } else if (text.includes("설계변경") || text.includes("계약금액")) {
                    explanation = "설계변경으로 시공방법의 변경, 투입자재의 변경 등 공사량의 증감이 발생하는 경우 증감된 공사량의 단가는 계약단가로 하되, 계약단가가 예정가격단가보다 높은 경우로서 물량이 증가할 때는 예정가격단가를 적용합니다. 신규비목은 설계변경 당시를 기준으로 산정한 단가에 낙찰율을 곱한 금액으로 합니다.";
                    citation = "(계약예규) 공사계약일반조건 제20조(설계변경으로 인한 계약금액의 조정)";
                } else if (text.includes("공고") || text.includes("기간") || text.includes("경쟁적대화")) {
                    explanation = "경쟁적 대화에 의한 계약의 경우 기본 제안서 제출마감일의 전일부터 기산하여 40일 전에 입찰공고를 하여야 합니다. 다만, 긴급한 경우, 추정가격이 고시금액 미만인 경우 등에는 제안서 제출마감일의 전일부터 기산하여 10일 전까지 공고할 수 있습니다.";
                    citation = "(계약예규) 경쟁적대화에 의한 계약체결기준 제4조(입찰공고)";
                } else {
                    explanation = "요청하신 실무 내용과 관련된 일반적인 계약예규 기준입니다. 계약당사자는 계약문서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 계약을 이행하여야 하며, 구두에 의한 지시는 문서로 보완되어야 효력이 발생합니다.";
                    citation = "(계약예규) 공사계약일반조건 제1조 및 제5조 / 물품구매계약일반조건 제1조";
                }

                botBubble.innerHTML = `
                    <div class="bg-blue-900 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">BOT</div>
                    <div class="bg-slate-100 rounded-2xl px-4 py-3 max-w-2xl text-sm leading-relaxed text-slate-700 shadow-sm space-y-3">
                        <p class="font-medium text-slate-900">${explanation}</p>
                        <div class="pt-2 border-t border-slate-200 text-xs font-semibold text-blue-800 bg-blue-50 px-3 py-2 rounded-xl inline-block shadow-xs">
                            📘 근거 조항: ${citation}
                        </div>
                    </div>
                `;
                chatBox.appendChild(botBubble);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

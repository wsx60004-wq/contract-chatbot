<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계약예규 및 행정 실무 챗봇</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .chat-container { height: calc(100vh - 140px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">📋 계약예규 & 행정 실무 챗봇</h1>
            <p class="text-xs text-blue-200">정확한 규정과 근거 조항을 바탕으로 신뢰성 있는 답변을 제공합니다.</p>
        </div>
        <span class="text-xs bg-blue-800 px-3 py-1 rounded-full text-blue-100">Version 2.6 (2026 기준)</span>
    </header>

    <!-- 메인 채팅 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col chat-container">
        <div id="chat-box" class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 overflow-y-auto space-y-4 flex flex-col">
            <!-- 봇 초기 인사말 -->
            <div class="flex items-start space-x-3">
                <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">BOT</div>
                <div class="bg-slate-100 rounded-2xl px-4 py-3 max-w-xl text-sm leading-relaxed text-slate-700 shadow-sm">
                    안녕하세요! 계약예규 및 행정 실무 챗봇입니다. 경쟁적대화, 공동계약, 종합심사낙찰제, 공사/물품/용역 계약일반조건 등에 대해 궁금한 점을 질문해 주시면 <strong>근거 조항과 출처</strong>를 함께 안내해 드리겠습니다.
                </div>
            </div>
        </div>

        <!-- 하단 입력창 -->
        <div class="mt-4 flex gap-2">
            <input type="text" id="user-input" placeholder="예: 낙찰자 결정 방법이나 지체상금 산정 기준을 알려주세요." 
                class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm bg-white shadow-sm"
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold text-sm transition shadow-sm">
                전송
            </button>
        </div>
    </main>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (!userText) return;

            // 사용자 메시지 추가
            const userBubble = document.createElement('div');
            userBubble.className = "flex items-start justify-end space-x-3";
            userBubble.innerHTML = `
                <div class="bg-blue-600 text-white rounded-2xl px-4 py-3 max-w-xl text-sm leading-relaxed shadow-sm">
                    ${escapeHtml(userText)}
                </div>
                <div class="bg-slate-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">나</div>
            `;
            chatBox.appendChild(userBubble);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 가상의 봇 응답 생성 (모의 시연)
            setTimeout(() => {
                const botBubble = document.createElement('div');
                botBubble.className = "flex items-start space-x-3";
                
                let responseContent = "질문하신 내용에 대한 실무 처리 기준입니다. 계약담당공무원은 규정된 바에 따라 신의와 성실의 원칙에 입각하여 처리하여야 합니다.";
                let citation = "(계약예규) 공사계약일반조건 제1조(총칙)";

                if (userText.includes("지체상금") || userText.includes("지체")) {
                    responseContent = "계약상대자가 계약서에 정한 준공기한 내에 공사를 완성하지 아니한 때에는 매 지체일수마다 지체상금률을 계약금액에 곱하여 산출한 금액을 현금으로 납부하여야 합니다. 다만, 납부할 금액이 계약금액의 100분의 30을 초과하는 경우에는 100분의 30으로 합니다.";
                    citation = "(계약예규) 공사계약일반조건 제25조(지체상금)";
                } else if (userText.includes("낙찰자") || userText.includes("종합심사")) {
                    responseContent = "종합심사 점수가 최고점인 자를 낙찰자로 결정합니다. 종합심사 점수가 최고점인 자가 둘 이상인 경우에는 공사수행능력 및 사회적책임 합산점수가 높은 자, 균형가격에 근접한 자 등의 순으로 낙찰자를 결정합니다.";
                    citation = "(계약예규) 공사계약 종합심사낙찰제 심사기준 제13조(낙찰자 결정)";
                }

                botBubble.innerHTML = `
                    <div class="bg-blue-900 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">BOT</div>
                    <div class="bg-slate-100 rounded-2xl px-4 py-3 max-w-2xl text-sm leading-relaxed text-slate-700 shadow-sm space-y-2">
                        <p>${responseContent}</p>
                        <div class="mt-2 pt-2 border-t border-slate-200 text-xs font-semibold text-blue-800 bg-blue-50 px-3 py-1.5 rounded-lg inline-block">
                            📘 근거 조항: ${citation}
                        </div>
                    </div>
                `;
                chatBox.appendChild(botBubble);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
